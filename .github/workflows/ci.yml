name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # pnpm 10+ 的 `pnpm ci` 是内置的 clean install，脚本必须写成 `pnpm run ci`
      - run: pnpm run ci
      # -p 与 fake 供应商由 B6 / B1 交付；B9 去掉这里的 if 启用 Windows 冒烟
      - name: print smoke (windows)
        if: ${{ false && runner.os == 'Windows' }}
        run: node dist/bundle/ama.cjs -p "hi" --provider fake --model fake/echo

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: pack
        run: |
          mkdir -p release
          cp dist/bundle/ama.cjs release/ama.cjs
          pnpm pack --pack-destination release
          mv release/*.tgz release/package.tgz
          cd release && sha256sum ama.cjs package.tgz > SHA256SUMS
      # 只上传 Release 附件；不执行 npm publish（设计 D15 / §14）
      - name: github release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          release/ama.cjs release/package.tgz release/SHA256SUMS
          --title "$GITHUB_REF_NAME" --generate-notes
