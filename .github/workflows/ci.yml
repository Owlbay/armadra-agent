name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          # release:check 与上一个 v* tag 比较，需要完整历史与 tag
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # pnpm 10+ 的 `pnpm ci` 是内置的 clean install，脚本必须写成 `pnpm run ci`
      - run: pnpm run ci
      # bundle 级 e2e（fake 供应商，不花钱）：bundle 已由 ci 构建。环境变量写在步骤上，
      # 不用 `AMA_E2E=1 pnpm …` 的前缀写法（Windows 的 cmd 不认）。
      - name: e2e
        env:
          AMA_E2E: "1"
        run: pnpm exec vitest run test/e2e
      - name: print + codemode smoke (windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $hi = node dist/bundle/ama.cjs -p "hi" --model fake/echo
          if ($LASTEXITCODE -ne 0 -or $hi -ne "hi") { Write-Error "print smoke: $hi"; exit 1 }
          $env:AMA_FAKE_SCRIPT = "test/fixtures/scripts/codemode-parallel.json"
          $out = node dist/bundle/ama.cjs -p "summarize" --model fake/echo --tools-preset codemode --allow codemode
          if ($LASTEXITCODE -ne 0 -or $out -ne "Summary written from the codemode output.") {
            Write-Error "codemode smoke: $out"; exit 1
          }

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # OIDC 令牌：npm 可信发布（trusted publishing）与 provenance 都要它
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          # 写入指向 npmjs 的 .npmrc，认证读 NODE_AUTH_TOKEN
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # tag 名必须等于 v<package.json version>；协议常量变化要求破坏性版本升级
      - run: pnpm run release:check
      - run: pnpm run build
      # 双 bundle：ama.cjs 运行时在同目录找 ama-sandbox.cjs（codemode 沙箱入口）
      - name: pack
        run: |
          mkdir -p release
          cp dist/bundle/ama.cjs release/ama.cjs
          cp dist/bundle/ama-sandbox.cjs release/ama-sandbox.cjs
          pnpm pack --pack-destination release
          mv release/*.tgz release/package.tgz
          cd release && sha256sum ama.cjs ama-sandbox.cjs package.tgz > SHA256SUMS
      # 先发 GitHub Release 附件，再发 npm（设计 D15 / §14）
      # 同一 tag 偶发重复触发：Release 已存在时改为覆盖上传附件，不让后一次运行失败
      - name: github release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets="release/ama.cjs release/ama-sandbox.cjs release/package.tgz release/SHA256SUMS"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::Release $GITHUB_REF_NAME 已存在，覆盖上传附件"
            gh release upload "$GITHUB_REF_NAME" $assets --clobber
          else
            gh release create "$GITHUB_REF_NAME" $assets --title "$GITHUB_REF_NAME" --generate-notes
          fi
      # npm 可信发布（trusted publishing）需要 npm ≥ 11.5.1；Node 22 自带的是 npm 10。
      - name: npm (trusted publishing)
        run: |
          npm install -g npm@^11.5.1
          npm --version
      # 发布到 npm：版本已由 release:check 对齐 tag；同一版本已在 npm 上（重跑 job）时跳过。
      # 认证顺序由 npm 决定：先用 OIDC（job 有 id-token: write，且 npmjs.com 上为本仓库的 ci.yml
      # 配了 Trusted Publisher），换不到令牌时回退到 NODE_AUTH_TOKEN（NPM_TOKEN secret，可不配）。
      # 两者都没有时 job 失败并给出配置提示。dist 已由上面的 build 产出。
      - name: npm publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::notice::$name@$version 已在 npm 上，跳过"
            exit 0
          fi
          if [ -n "$NPM_TOKEN" ]; then
            echo "认证：优先 OIDC trusted publishing，失败回退 NPM_TOKEN"
          else
            echo "认证：OIDC trusted publishing（未配置 NPM_TOKEN，无回退）"
          fi
          if npm publish --provenance --access public; then
            exit 0
          fi
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::npm publish 失败：请在 npmjs.com 的 $name 包设置 → Trusted Publisher 添加 GitHub Actions（组织 Owlbay、仓库 armadra-agent、工作流 ci.yml、环境留空），或在仓库 secrets 配置 NPM_TOKEN"
          fi
          exit 1
