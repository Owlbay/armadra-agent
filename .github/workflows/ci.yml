name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          # release:check 与上一个 v* tag 比较，需要完整历史与 tag
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # pnpm 10+ 的 `pnpm ci` 是内置的 clean install，脚本必须写成 `pnpm run ci`
      - run: pnpm run ci
      # bundle 级 e2e（fake 供应商，不花钱）：bundle 已由 ci 构建。环境变量写在步骤上，
      # 不用 `AMA_E2E=1 pnpm …` 的前缀写法（Windows 的 cmd 不认）。
      - name: e2e
        env:
          AMA_E2E: "1"
        run: pnpm exec vitest run test/e2e
      - name: print + codemode smoke (windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $hi = node dist/bundle/ama.cjs -p "hi" --model fake/echo
          if ($LASTEXITCODE -ne 0 -or $hi -ne "hi") { Write-Error "print smoke: $hi"; exit 1 }
          $env:AMA_FAKE_SCRIPT = "test/fixtures/scripts/codemode-parallel.json"
          $out = node dist/bundle/ama.cjs -p "summarize" --model fake/echo --tools-preset codemode --allow codemode
          if ($LASTEXITCODE -ne 0 -or $out -ne "Summary written from the codemode output.") {
            Write-Error "codemode smoke: $out"; exit 1
          }

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # tag 名必须等于 v<package.json version>；协议常量变化要求破坏性版本升级
      - run: pnpm run release:check
      - run: pnpm run build
      # 双 bundle：ama.cjs 运行时在同目录找 ama-sandbox.cjs（codemode 沙箱入口）
      - name: pack
        run: |
          mkdir -p release
          cp dist/bundle/ama.cjs release/ama.cjs
          cp dist/bundle/ama-sandbox.cjs release/ama-sandbox.cjs
          pnpm pack --pack-destination release
          mv release/*.tgz release/package.tgz
          cd release && sha256sum ama.cjs ama-sandbox.cjs package.tgz > SHA256SUMS
      # 只上传 Release 附件；不执行 npm publish（设计 D15 / §14）
      - name: github release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          release/ama.cjs release/ama-sandbox.cjs release/package.tgz release/SHA256SUMS
          --title "$GITHUB_REF_NAME" --generate-notes
